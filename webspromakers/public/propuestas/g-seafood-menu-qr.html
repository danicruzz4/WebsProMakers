/* ==========================================================================

   El estilo propio de cada demo está en /demos/<demo>/style.css
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
* { min-width: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; overflow-x: clip; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
.icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
img.is-missing { visibility: hidden; }
.ph { position: relative; overflow: hidden; background: linear-gradient(135deg, var(--ph1, #c9b79c), var(--ph2, #7d6b55)); }
.ph img { width: 100%; height: 100%; object-fit: cover; position: relative; }

/* Demo banner */
.demo-banner { position: relative; z-index: 200; display: flex; align-items: center; justify-content: center; gap: 8px 16px; flex-wrap: wrap; padding: 8px 16px; background: #0e1311; color: #e9efe9; font: 500 13px/1.4 "Inter", system-ui, sans-serif; text-align: center; }
.demo-banner a { color: #a8d5b9; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.demo-banner a:hover { text-decoration: underline; }
.demo-banner svg { width: 18px; height: 18px; flex: none; }

/* Language switcher (shared markup) */
.lang { position: relative; }
.lang-btn { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid currentColor; background: transparent; cursor: pointer; font-size: 14px; font-weight: 600; opacity: .9; }
.lang-btn .icon { width: 17px; height: 17px; }
.lang-menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 180px; padding: 6px; background: #fff; color: #111; border-radius: 12px; box-shadow: 0 20px 50px -15px rgba(0, 0, 0, .35), 0 0 0 1px rgba(0, 0, 0, .06); z-index: 150; font-family: "Inter", system-ui, "PingFang SC", "Noto Sans SC", sans-serif; }
.lang-menu button { width: 100%; text-align: left; padding: 10px 12px; border: 0; background: none; border-radius: 8px; cursor: pointer; font-size: 15px; display: flex; justify-content: space-between; }
.lang-menu button:hover, .lang-menu button:focus-visible { background: #f2efe9; }
.lang-menu button[aria-checked="true"] { font-weight: 700; }
.lang-menu button[aria-checked="true"]::after { content: "✓"; }

/* Forms (shared behaviour; each demo themes them) */
.d-field { display: flex; flex-direction: column; gap: 6px; }
.d-field label { font-size: 14px; font-weight: 600; }
.d-field input, .d-field select, .d-field textarea { width: 100%; min-height: 48px; padding: 11px 13px; font-size: 16px; border-radius: 10px; border: 1px solid rgba(0, 0, 0, .18); background: #fff; color: #111; }
.d-field textarea { min-height: 100px; resize: vertical; }
.d-field [aria-invalid="true"] { border-color: #c0392b !important; background: #fff7f6; }
.field-error { font-size: 13px; color: #c0392b; font-weight: 500; }
.field-error:empty { display: none; }
.d-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.d-grid .full { grid-column: 1 / -1; }
@media (max-width: 600px) { .d-grid { grid-template-columns: 1fr; } }

/* Demo modal */
.d-modal { position: fixed; inset: 0; z-index: 400; display: grid; place-items: center; padding: 18px; background: rgba(10, 12, 11, .6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .25s; }
.d-modal.is-open { opacity: 1; }
.d-modal-card { width: min(480px, 100%); max-height: calc(100vh - 36px); overflow: auto; background: #fff; color: #111; border-radius: 20px; padding: 26px; font: 15px/1.55 "Inter", system-ui, "PingFang SC", "Noto Sans SC", sans-serif; box-shadow: 0 40px 80px -20px rgba(0, 0, 0, .5); transform: translateY(12px); transition: transform .3s; }
.d-modal.is-open .d-modal-card { transform: none; }
.d-modal-card h2 { font: 800 22px/1.2 "Manrope", "Inter", system-ui, sans-serif; letter-spacing: -.01em; display: flex; gap: 10px; align-items: center; }
.d-modal-card h2 span { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: #e3f0e8; color: #1d4b3a; letter-spacing: 0; }
.d-modal-card p { margin-top: 10px; color: #444; }
.d-modal-msg { margin-top: 14px; background: #dcf8c6; border-radius: 12px 0 12px 12px; padding: 12px 14px; white-space: pre-line; font-size: 14.5px; color: #111; }
.d-modal-msg.plain { background: #f3f1ec; border-radius: 12px; }
.d-modal-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; padding-top: 18px; border-top: 1px solid #eee; align-items: center; }
.d-modal-actions small { flex: 1 1 100%; color: #666; font-size: 13px; }
.d-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 999px; font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer; border: 1px solid transparent; background: #1d4b3a; color: #fff; }
.d-btn--ghost { background: transparent; color: #111; border-color: #ccc; }

/* Lightbox */
.d-lightbox { position: fixed; inset: 0; z-index: 400; background: rgba(0, 0, 0, .9); display: grid; place-items: center; padding: 24px; }
.d-lightbox img { max-height: 86vh; max-width: 100%; border-radius: 8px; object-fit: contain; }
.d-lightbox button { position: absolute; top: 14px; right: 14px; width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .15); color: #fff; font-size: 24px; cursor: pointer; }

/* Floating WhatsApp (demo) */
.d-wa { position: fixed; right: 18px; bottom: 18px; z-index: 90; width: 56px; height: 56px; border-radius: 50%; border: 0; background: #1fa855; color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 12px 30px -8px rgba(31, 168, 85, .7); transition: transform .25s; }
.d-wa:hover { transform: scale(1.07); }
.d-wa svg { width: 30px; height: 30px; }

/* Toast */
.wpm-toast { position: fixed; left: 50%; bottom: 24px; z-index: 500; transform: translate(-50%, 160%); background: #111; color: #fff; padding: 13px 18px; border-radius: 12px; font: 15px/1.4 "Inter", system-ui, sans-serif; max-width: calc(100% - 32px); transition: transform .35s; text-align: center; }
.wpm-toast.is-on { transform: translate(-50%, 0); }

/* Mobile nav helper */
.d-burger { display: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid currentColor; background: transparent; cursor: pointer; place-items: center; }
.d-burger span, .d-burger span::before, .d-burger span::after { display: block; width: 18px; height: 2px; background: currentColor; border-radius: 2px; position: relative; content: ""; transition: transform .25s, background .25s; }
.d-burger span::before { position: absolute; top: -6px; }
.d-burger span::after { position: absolute; top: 6px; }
.nav-open .d-burger span { background: transparent; }
.nav-open .d-burger span::before { transform: translateY(6px) rotate(45deg); }
.nav-open .d-burger span::after { transform: translateY(-6px) rotate(-45deg); }

/* Reveal */
.js-ready [data-reveal] { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s ease; }
.js-ready [data-reveal].is-in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

</style>

(function () {
  "use strict";
  var CFG = window.WPM_CONFIG || {};
  var LANGS = (CFG.languages || [{ code: "en", label: "English", short: "EN" }]);
  var CODES = LANGS.map(function (l) { return l.code; });
  var DEFAULT = CODES[0];
  var STORE_KEY = "wpm-lang";
  var HTML_LANG = { en: "en", ms: "ms", es: "es", zh: "zh-CN" };

  var dict = {};       // dict[lang][key]
  var en = {};         // English snapshot taken from the HTML
  var current = DEFAULT;

  /* ---------- small helpers ---------- */
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function get(obj, path) {
    return path.split(".").reduce(function (o, k) { return o && o[k] != null ? o[k] : undefined; }, obj);
  }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  /* ---------- i18n ---------- */

  }
  function t(key, lang) {
    lang = lang || current;
    var v = dict[lang] && dict[lang][key];
    if (v == null) v = (dict.en && dict.en[key]) != null ? dict.en[key] : en[key];
    return v == null ? key : v;
  }
  var ATTRS = [["data-i18n-ph", "placeholder"], ["data-i18n-aria", "aria-label"], ["data-i18n-alt", "alt"], ["data-i18n-title", "title"], ["data-i18n-content", "content"]];

  function snapshot() {
    $all("[data-i18n]").forEach(function (el) { var k = el.getAttribute("data-i18n"); if (!(k in en)) en[k] = el.textContent.trim(); });
    $all("[data-i18n-html]").forEach(function (el) { var k = el.getAttribute("data-i18n-html"); if (!(k in en)) en[k] = el.innerHTML.trim(); });
    ATTRS.forEach(function (a) {
      $all("[" + a[0] + "]").forEach(function (el) { var k = el.getAttribute(a[0]); if (!(k in en)) en[k] = el.getAttribute(a[1]) || ""; });
    });
  }

  function apply(lang) {
    if (CODES.indexOf(lang) < 0) lang = DEFAULT;
    current = lang;
    document.documentElement.lang = HTML_LANG[lang] || lang;
    document.documentElement.setAttribute("data-lang", lang);
    $all("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    $all("[data-i18n-html]").forEach(function (el) { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
    ATTRS.forEach(function (a) {
      $all("[" + a[0] + "]").forEach(function (el) { el.setAttribute(a[1], t(el.getAttribute(a[0]))); });
    });
    // Re-translate visible validation messages
    $all("[data-err-key]").forEach(function (el) { el.textContent = t(el.getAttribute("data-err-key")); });
    $all("[data-lang-current]").forEach(function (el) {
      var l = LANGS.filter(function (x) { return x.code === lang; })[0];
      el.textContent = l ? l.short : lang.toUpperCase();
    });
    $all("[data-lang-option]").forEach(function (el) {
      el.setAttribute("aria-checked", el.getAttribute("data-lang-option") === lang ? "true" : "false");
    });
    store(STORE_KEY, lang);
    document.dispatchEvent(new CustomEvent("wpm:lang", { detail: { lang: lang } }));
  }

  function initialLang() {
    var q = new URLSearchParams(location.search).get("lang");
    if (q && CODES.indexOf(q) >= 0) return q;
    var s = store(STORE_KEY);
    if (s && CODES.indexOf(s) >= 0) return s;
    return DEFAULT;
  }

  /* ---------- language switcher ---------- */
  function buildSwitchers() {
    $all("[data-lang-switch]").forEach(function (box) {
      var btn = box.querySelector("button");
      var menu = document.createElement("ul");
      menu.className = "lang-menu";
      menu.setAttribute("role", "menu");
      menu.hidden = true;
      LANGS.forEach(function (l) {
        var li = document.createElement("li");
        var b = document.createElement("button");
        b.type = "button";
        b.setAttribute("role", "menuitemradio");
        b.setAttribute("data-lang-option", l.code);
        b.setAttribute("lang", HTML_LANG[l.code] || l.code);
        b.textContent = l.label;
        b.addEventListener("click", function () { apply(l.code); close(); btn.focus(); });
        li.appendChild(b); menu.appendChild(li);
      });
      box.appendChild(menu);
      function close() { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); }
      btn.setAttribute("aria-haspopup", "true");
      btn.setAttribute("aria-expanded", "false");
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = menu.hidden;
        $all(".lang-menu").forEach(function (m) { m.hidden = true; });
        menu.hidden = !open;
        btn.setAttribute("aria-expanded", open ? "true" : "false");
        if (open) { var first = menu.querySelector('[aria-checked="true"]') || menu.querySelector("button"); first && first.focus(); }
      });
      box.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { close(); btn.focus(); }
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          var items = $all("button", menu), i = items.indexOf(document.activeElement);
          if (i < 0) return;
          e.preventDefault();
          items[(i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus();
        }
      });
      document.addEventListener("click", function (e) { if (!box.contains(e.target)) close(); });
    });
  }

  /* ---------- photos ---------- */
  function photoUrl(val, w) {
    if (!val) return "";
    if (val.indexOf("u:") === 0) return "https://images.unsplash.com/photo-" + val.slice(2) + "?auto=format&fit=crop&w=" + w + "&q=70";
    return val;
  }
  function loadPhotos(root) {
    var P = window.WPM_PHOTOS || {};
    $all("img[data-photo]", root).forEach(function (img) {
      if (img.getAttribute("src")) return;
      var val = P[img.getAttribute("data-photo")];
      var w = parseInt(img.getAttribute("data-w") || "800", 10);
      if (!val) { img.classList.add("is-missing"); return; }
      img.addEventListener("error", function () { img.classList.add("is-missing"); }, { once: true });
      img.decoding = "async";
      if (!img.hasAttribute("loading")) img.loading = "lazy";
      if (val.indexOf("u:") === 0) img.srcset = photoUrl(val, w) + " 1x, " + photoUrl(val, Math.min(w * 2, 2400)) + " 2x";
      img.src = photoUrl(val, w);
    });
  }

  /* ---------- config-driven contact details ---------- */
  function waLink(number, text) {
    return "https://wa.me/" + String(number).replace(/[^\d]/g, "") + (text ? "?text=" + encodeURIComponent(text) : "");
  }
  function bindConfig() {
    var c = CFG.contact || {}, s = CFG.social || {};
    $all("[data-cfg-text]").forEach(function (el) {
      var v = get(CFG, el.getAttribute("data-cfg-text"));
      if (v) { el.textContent = v; el.removeAttribute("data-i18n"); el.classList.remove("is-empty"); }
      else { el.setAttribute("data-i18n", "common.soon"); el.classList.add("is-empty"); }
    });
    $all("[data-cfg-mail]").forEach(function (a) {
      if (c.email) a.href = "mailto:" + c.email; else { a.removeAttribute("href"); a.classList.add("is-empty"); }
    });
    $all("[data-cfg-tel]").forEach(function (a) {
      if (c.phone) a.href = "tel:" + c.phone.replace(/[^\d+]/g, ""); else { a.removeAttribute("href"); a.classList.add("is-empty"); }
    });
    $all("[data-social]").forEach(function (a) {
      var url = s[a.getAttribute("data-social")];
      if (url) { a.href = url; a.target = "_blank"; a.rel = "noopener"; } else a.hidden = true;
    });
    $all("[data-social-group]").forEach(function (g) {
      if (!$all("[data-social]:not([hidden])", g).length) g.classList.add("is-empty");
    });
    $all("[data-map]").forEach(function (f) {
      var q = f.getAttribute("data-map") || (CFG.map && CFG.map.query) || "Langkawi";
      f.src = "https://www.google.com/maps?q=" + encodeURIComponent(q) + "&output=embed";
    });
    $all("[data-map-link]").forEach(function (a) {
      var q = a.getAttribute("data-map-link") || (CFG.map && CFG.map.query) || "Langkawi";
      a.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
      a.target = "_blank"; a.rel = "noopener";
    });
    $all("[data-year]").forEach(function (el) { el.textContent = new Date().getFullYear(); });
  }
  // WhatsApp links of the agency (main site). Demos use their own demo modal.
  function bindWhatsApp() {
    var num = (CFG.contact || {}).whatsapp;
    $all("[data-wa]").forEach(function (a) {
      function refresh() {
        if (num) { a.href = waLink(num, t(a.getAttribute("data-wa") || "wa.default")); a.target = "_blank"; a.rel = "noopener"; }
        else { a.href = "#contact"; a.removeAttribute("target"); }
      }
      refresh();
      document.addEventListener("wpm:lang", refresh);
      if (!num) a.addEventListener("click", function () { toast(t("toast.waSoon")); });
    });
  }

  /* ---------- analytics (only if configured) ---------- */
  function analytics() {
    var id = CFG.analytics && CFG.analytics.gaMeasurementId;
    if (!id) return;
    var s = document.createElement("script");
    s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(id);
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); };
    window.gtag("js", new Date());
    window.gtag("config", id, { anonymize_ip: true });
  }

  /* ---------- toast ---------- */
  var toastEl, toastTimer;
  function toast(msg) {
    if (!toastEl) {
      toastEl = document.createElement("div");
      toastEl.className = "wpm-toast";
      toastEl.setAttribute("role", "status");
      toastEl.setAttribute("aria-live", "polite");
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add("is-on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("is-on"); }, 4200);
  }

  /* ---------- form validation ---------- */
  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  var PHONE_RE = /^\+?[\d\s\-().]{7,20}$/;
  function fieldError(field) {
    var v = (field.value || "").trim();
    if (field.required && !v) return field.tagName === "SELECT" ? "val.select" : "val.required";
    if (v && field.type === "email" && !EMAIL_RE.test(v)) return "val.email";
    if (v && field.getAttribute("data-validate") === "phone" && !PHONE_RE.test(v)) return "val.phone";
    if (v && field.type === "number") {
      var n = Number(v), min = field.min !== "" ? Number(field.min) : null, max = field.max !== "" ? Number(field.max) : null;
      if (isNaN(n) || (min !== null && n < min) || (max !== null && n > max)) return "val.number";
    }
    if (v && field.type === "date" && field.min && v < field.min) return "val.date";
    if (field.getAttribute("data-after")) {
      var other = field.form && field.form.querySelector("#" + field.getAttribute("data-after"));
      if (v && other && other.value && v <= other.value) return "val.after";
    }
    if (field.minLength > 0 && v && v.length < field.minLength) return "val.short";
    return null;
  }
  function showError(field, key) {
    var id = field.id + "-err", box = document.getElementById(id);
    if (!box) {
      box = document.createElement("p");
      box.id = id; box.className = "field-error";
      field.parentNode.appendChild(box);
    }
    if (key) {
      box.textContent = t(key); box.setAttribute("data-err-key", key);
      field.setAttribute("aria-invalid", "true");
      field.setAttribute("aria-describedby", id);
    } else {
      box.textContent = ""; box.removeAttribute("data-err-key");
      field.removeAttribute("aria-invalid");
    }
  }
  function validateForm(form) {
    var first = null;
    $all("input, select, textarea", form).forEach(function (f) {
      if (f.type === "hidden" || f.disabled || f.name === "botcheck") return;
      var k = fieldError(f);
      showError(f, k);
      if (k && !first) first = f;
    });
    if (first) first.focus();
    return !first;
  }
  function liveValidate(form) {
    form.setAttribute("novalidate", "");
    $all("input, select, textarea", form).forEach(function (f) {
      var ev = f.tagName === "SELECT" || f.type === "date" ? "change" : "blur";
      f.addEventListener(ev, function () { if (f.value || f.hasAttribute("aria-invalid")) showError(f, fieldError(f)); });
      f.addEventListener("input", function () { if (f.hasAttribute("aria-invalid")) showError(f, fieldError(f)); });
    });
    // Dates cannot be in the past
    var today = new Date(); today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
    $all('input[type="date"]', form).forEach(function (d) { d.min = today.toISOString().slice(0, 10); });
  }
  function formData(form) {
    var out = {};
    $all("input, select, textarea", form).forEach(function (f) {
      if (!f.name || f.type === "hidden" || f.name === "botcheck") return;
      var label = form.querySelector('label[for="' + f.id + '"]');
      var val = f.tagName === "SELECT" && f.selectedIndex >= 0 ? f.options[f.selectedIndex].text : f.value;
      out[f.name] = { label: label ? label.textContent.replace(/\*/g, "").trim() : f.name, value: (val || "").trim() };
    });
    return out;
  }

  /* ---------- reveal on scroll ---------- */
  function reveal() {
    var els = $all("[data-reveal]");
    if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) {

    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add("is-in"); io.unobserve(en.target); } });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
    els.forEach(function (e) { io.observe(e); });
  }

  /* ---------- boot ---------- */
  function boot() {
    snapshot();
    bindConfig();
    buildSwitchers();
    bindWhatsApp();
    loadPhotos();
    apply(initialLang());
    reveal();
    analytics();
    document.documentElement.classList.add("js-ready");
  }

  window.WPM = {
    config: CFG, addStrings: addStrings, t: t, apply: apply, lang: function () { return current; },
    toast: toast, validateForm: validateForm, liveValidate: liveValidate, formData: formData,
    waLink: waLink, loadPhotos: loadPhotos, $all: $all, boot: boot
  };
})();

<script>
/* Huecos de foto con las fotos reales del negocio (Google Maps / las que os dé el dueño).
   Cada demo tiene su fotos.js:  window.PP_FOTOS = { "clave": ["fotos/archivo.jpg", "foto-de-reserva"] }
   1) Si existe fotos/archivo.jpg, se usa.
   2) Si no existe y hay foto de reserva (clave de photos.js / common.js), se usa la de reserva.
   3) Si no hay ninguna, se ve un hueco con el nombre de la foto que va ahí. */
(function () {
  "use strict";
  var F = window.PP_FOTOS || {}, P = window.WPM_PHOTOS = window.WPM_PHOTOS || {}, STOCK = {};
  var me = document.currentScript, ROOT = me ? me.src.replace(/pp\/slots\.js(\?.*)?$/, "") : "";
  Object.keys(F).forEach(function (k) {
    if (P[k] && !STOCK[k]) STOCK[k] = P[k];
    P[k] = /^(https?:|\/)/.test(F[k][0]) ? F[k][0] : ROOT + F[k][0];
  });
  function stockUrl(key, w) {
    var v = STOCK[key] || P[key];
    if (!v || v.indexOf("u:") !== 0) return v || "";
    return "https://images.unsplash.com/photo-" + v.slice(2) + "?auto=format&fit=crop&w=" + w + "&q=70";
  }
  function label(img) {
    img.classList.add("is-missing");
    var ph = img.closest(".ph");
    if (ph) ph.setAttribute("data-ph-label", img.getAttribute("alt") || "Photo");
  }
  function fail(img) {
    var key = img.getAttribute("data-photo"), slot = F[key];
    if (!slot) return;
    var fb = slot[1];
    if (fb && !img.getAttribute("data-fb")) {
      var w = parseInt(img.getAttribute("data-w") || "800", 10), url = fb.indexOf("u:") === 0 ? "https://images.unsplash.com/photo-" + fb.slice(2) + "?auto=format&fit=crop&w=" + w + "&q=70" : stockUrl(fb, w);
      if (url) {
        img.setAttribute("data-fb", "1");
        img.removeAttribute("srcset");
        setTimeout(function () { img.classList.remove("is-missing"); img.src = url; }, 0);
        return;
      }
    }
    label(img);
  }
  document.addEventListener("error", function (e) {
    var img = e.target;
    if (img && img.tagName === "IMG" && img.hasAttribute("data-photo")) fail(img);
  }, true);
  function relabel() {
    Array.prototype.forEach.call(document.querySelectorAll(".ph[data-ph-label] img"), function (img) {
      img.closest(".ph").setAttribute("data-ph-label", img.getAttribute("alt") || "Photo");
    });
  }
  document.addEventListener("wpm:lang", function () { setTimeout(relabel, 40); });
})();

</script>
